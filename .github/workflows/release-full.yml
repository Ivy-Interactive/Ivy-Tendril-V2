name: Full Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        type: string
        required: true
      release-notes:
        description: 'Optional release notes (markdown)'
        type: string
        required: false
      test-mode:
        description: 'Dry-run test mode (skips publishing)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-components:
    name: Build Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @ivy-interactive/components check

      - name: Run tests
        run: pnpm --filter @ivy-interactive/components test

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./src/packages/components/package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"
          cd src/packages/components
          # --allow-same-version: re-running a release at the version already in package.json is a
          # normal retry, and npm exits non-zero on it otherwise.
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Build components package
        run: pnpm --filter @ivy-interactive/components build

      - name: Pack tarball
        run: |
          # An absolute destination, because `pnpm --filter` runs `pack` with the *package* as its
          # cwd: a relative `dist-pack` put the tarball in src/packages/components/dist-pack while
          # the upload below looked for it at the repo root, and found nothing.
          mkdir -p dist-pack
          pnpm --filter @ivy-interactive/components pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          ls -la dist-pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-release-components
          path: dist-pack/*.tgz

      - name: Publish to npm
        if: (github.event_name == 'push' && !inputs.test-mode) || (github.event_name == 'workflow_dispatch' && inputs.test-mode == false)
        working-directory: src/packages/components
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # tendril-wireframe embeds the generated payload with include_bytes!, and build.rs fails the
      # build without it. It is not checked in, so it must be generated before cargo runs. This job
      # otherwise needs no Node at all.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate wireframe payload
        working-directory: src/crates/tendril-wireframe/pipeline/vendor
        run: |
          pnpm install --frozen-lockfile
          node build-all.mjs

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: cross-rs/cargo-install-action@v1
        with:
          tool: cross

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "tendril-cli") | .version')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin tendril
          else
            cargo build --release --target ${{ matrix.target }} --bin tendril
          fi

      - name: Assemble release archive
        run: |
          STAGING="tendril-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tendril.exe" "$STAGING/"
            [ -f README.md ] && cp README.md "$STAGING/"
            [ -f LICENSE ] && cp LICENSE "$STAGING/"
            ARCHIVE="${STAGING}.zip"
            7z a "$ARCHIVE" "$STAGING"
          else
            cp "target/${{ matrix.target }}/release/tendril" "$STAGING/"
            [ -f README.md ] && cp README.md "$STAGING/"
            [ -f LICENSE ] && cp LICENSE "$STAGING/"
            ARCHIVE="${STAGING}.tar.gz"
            tar -czvf "$ARCHIVE" "$STAGING"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "CHECKSUM=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-release-cli-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}

  build-server:
    name: Build Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          # Intel macOS, to match the CLI matrix. Without it a user on an Intel Mac could install
          # the CLI but had no server build to pair with it.
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # tendril-wireframe embeds the generated payload with include_bytes!, and build.rs fails the
      # build without it. It is not checked in, so it must be generated before cargo runs. This job
      # otherwise needs no Node at all.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate wireframe payload
        working-directory: src/crates/tendril-wireframe/pipeline/vendor
        run: |
          pnpm install --frozen-lockfile
          node build-all.mjs

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: cross-rs/cargo-install-action@v1
        with:
          tool: cross

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "tendril-server") | .version')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin tendril-server
          else
            cargo build --release --target ${{ matrix.target }} --bin tendril-server
          fi

      - name: Assemble release archive
        run: |
          STAGING="tendril-server-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tendril-server.exe" "$STAGING/"
            [ -f README.md ] && cp README.md "$STAGING/"
            [ -f LICENSE ] && cp LICENSE "$STAGING/"
            ARCHIVE="${STAGING}.zip"
            7z a "$ARCHIVE" "$STAGING"
          else
            cp "target/${{ matrix.target }}/release/tendril-server" "$STAGING/"
            [ -f README.md ] && cp README.md "$STAGING/"
            [ -f LICENSE ] && cp LICENSE "$STAGING/"
            ARCHIVE="${STAGING}.tar.gz"
            tar -czvf "$ARCHIVE" "$STAGING"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "CHECKSUM=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-release-server-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}

  build-desktop-app:
    name: Build App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon, so an arm64-only matrix shipped no installer at all for
          # an Intel Mac. macos-13 is the x86_64 runner; the two produce distinct `platform` names
          # so their artifacts do not collide on upload.
          - os: macos-latest
            platform: macos-arm64
          - os: macos-13
            platform: macos-x64
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(jq -r '.version' src/apps/tendril-app/src-tauri/tauri.conf.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"
          jq --arg v "$VERSION" '.version = $v' src/apps/tendril-app/src-tauri/tauri.conf.json > src/apps/tendril-app/src-tauri/tauri.conf.json.tmp && mv src/apps/tendril-app/src-tauri/tauri.conf.json.tmp src/apps/tendril-app/src-tauri/tauri.conf.json
          # The Cargo side too. Every crate inherits `[workspace.package].version`, and the app
          # crate compiles that in as its own - so bumping only tauri.conf.json shipped an installer
          # labelled $VERSION around a `tendril --version` that still said 0.1.0.
          perl -0pi -e 's/^(\[workspace\.package\]\nversion = )"[^"]*"/${1}"'"$VERSION"'"/m' Cargo.toml
          grep -A 1 '^\[workspace.package\]' Cargo.toml

      - name: Build components and frontend
        run: |
          pnpm --filter @ivy-interactive/components build
          pnpm --filter @ivy-interactive/tendril-app build

      # tendril-wireframe embeds the generated payload with include_bytes! and build.rs fails
      # without it. Node and pnpm are already set up for the frontend build above; this only has to
      # run before the first cargo invocation, which is the companion CLI below.
      - name: Generate wireframe payload
        working-directory: src/crates/tendril-wireframe/pipeline/vendor
        run: |
          pnpm install --frozen-lockfile
          node build-all.mjs

      - name: Build companion CLI binary
        run: |
          cargo build --release --bin tendril
          TARGET=$(rustc -vV | sed -n 's|host: ||p')
          mkdir -p src/apps/tendril-app/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/tendril.exe "src/apps/tendril-app/src-tauri/binaries/tendril-${TARGET}.exe"
          else
            cp target/release/tendril "src/apps/tendril-app/src-tauri/binaries/tendril-${TARGET}"
            chmod +x "src/apps/tendril-app/src-tauri/binaries/tendril-${TARGET}"
          fi

      # OpenCode is the agent behind the `opencode`, `ivy`, `openaiproxy` and `proxy` providers.
      # Bundling it as a second sidecar is what makes those work on a machine that has installed
      # nothing but Tendril - see `resolve_opencode_binary`, which looks next to the app executable
      # first. The script pins the upstream version; bump it there, not here.
      - name: Fetch bundled OpenCode sidecar
        run: ./src/apps/tendril-app/scripts/release/fetch-opencode-sidecar.sh

      - name: Build Tauri desktop app
        run: pnpm --filter @ivy-interactive/tendril-app exec tauri build

      - name: Collect bundle installers
        run: |
          mkdir -p dist-bundles
          # Only the bundle roots that exist. The old form passed both to one `find` and swallowed
          # the "No such file or directory" with `2>/dev/null || true` - which also swallowed a
          # build that produced no bundle at all, and published an empty release.
          BUNDLE_DIRS=()
          for d in target/release/bundle src/apps/tendril-app/src-tauri/target/release/bundle; do
            [ -d "$d" ] && BUNDLE_DIRS+=("$d")
          done
          if [ ${#BUNDLE_DIRS[@]} -eq 0 ]; then
            echo "::error::Tauri produced no bundle directory - nothing to release." >&2
            exit 1
          fi
          find "${BUNDLE_DIRS[@]}" -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist-bundles/ \;
          if [ -z "$(ls -A dist-bundles)" ]; then
            echo "::error::No installers matched under ${BUNDLE_DIRS[*]}." >&2
            exit 1
          fi
          cd dist-bundles
          for f in *; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          echo "Collected:"
          ls -la

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-release-app-${{ matrix.platform }}
          path: dist-bundles/*

  build-extension:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and tests
        run: |
          pnpm --filter ivy-tendril typecheck
          pnpm --filter ivy-tendril build
          pnpm --filter ivy-tendril test

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./src/extensions/vscode/package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"
          cd src/extensions/vscode
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Package extension
        run: pnpm package:extension

      - name: Generate SHA256 checksum
        run: |
          cd src/extensions/vscode
          VSIX_FILE=$(ls ivy-tendril-*.vsix)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$VSIX_FILE" > "${VSIX_FILE}.sha256"
          else
            shasum -a 256 "$VSIX_FILE" > "${VSIX_FILE}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-release-extension
          path: |
            src/extensions/vscode/*.vsix
            src/extensions/vscode/*.vsix.sha256

  publish-full-release:
    name: Publish Full Release
    needs: [build-components, build-cli, build-server, build-desktop-app, build-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "tendril-cli") | .version')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name "*.sha256" ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt
          echo "Consolidated checksums:"
          cat SHA256SUMS.txt

      - name: Dry-run Verification Summary
        if: (github.event_name == 'workflow_dispatch' && inputs.test-mode == true)
        run: |
          echo "=== DRY-RUN VERIFICATION SUMMARY ==="
          echo "Version: ${{ env.VERSION }}"
          echo "Artifacts prepared:"
          ls -la release-artifacts/
          echo "Dry run completed successfully. No release published."

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && !inputs.test-mode) || (github.event_name == 'workflow_dispatch' && inputs.test-mode == false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          # Tag the exact commit this run built, not the default branch head.
          target_commitish: ${{ github.sha }}
          name: Release v${{ env.VERSION }}
          body: ${{ inputs.release-notes }}
          generate_release_notes: ${{ inputs.release-notes == '' }}
          files: release-artifacts/*
