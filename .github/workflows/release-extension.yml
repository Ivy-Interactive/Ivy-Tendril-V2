name: Release Extension

on:
  workflow_dispatch:
    inputs:
      test-mode:
        description: 'Dry-run test mode (skips publishing)'
        type: boolean
        default: true
      version:
        description: 'Version override (e.g. 0.1.0)'
        type: string
        required: false
  push:
    tags:
      - 'extension-v*'
      - 'vscode-v*'

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-extension:
    name: Release Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm --filter tendril-extension typecheck

      - name: Build extension
        run: pnpm --filter tendril-extension build

      - name: Run tests
        run: pnpm --filter tendril-extension test

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VER="${{ inputs.version }}"
            VERSION="${INPUT_VER#v}"
          elif [[ "${{ github.ref }}" == refs/tags/extension-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/extension-v}"
          elif [[ "${{ github.ref }}" == refs/tags/vscode-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/vscode-v}"
          else
            VERSION=$(node -p "require('./extensions/vscode/package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="extension-v$VERSION"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          cd extensions/vscode
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package extension
        run: pnpm package:extension

      - name: Generate SHA256 checksum
        run: |
          cd extensions/vscode
          VSIX_FILE=$(ls tendril-extension-*.vsix)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$VSIX_FILE" > "${VSIX_FILE}.sha256"
          else
            shasum -a 256 "$VSIX_FILE" > "${VSIX_FILE}.sha256"
          fi
          echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_ENV

      - name: Upload VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tendril-extension-${{ steps.version.outputs.version }}
          path: |
            extensions/vscode/*.vsix
            extensions/vscode/*.vsix.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.test-mode)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            extensions/vscode/*.vsix
            extensions/vscode/*.vsix.sha256

      - name: Publish to Visual Studio Code Marketplace
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.test-mode)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath extensions/vscode/*.vsix --skip-duplicate
          else
            echo "VSCE_PAT secret is not set; skipping Visual Studio Code Marketplace publishing."
          fi

      - name: Publish to Open VSX Registry
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.test-mode)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish extensions/vscode/*.vsix --skip-duplicate
          else
            echo "OVSX_PAT secret is not set; skipping Open VSX publishing."
          fi

      - name: Extension publish summary
        if: always()
        run: |
          echo "## Ivy Tendril VS Code Extension" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.test-mode }}" = "true" ]; then
            echo "> **Test Mode**: Dry run only. Extension packaged and uploaded as artifact, but publishing and release asset upload were skipped." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Marketplace**: [Ivy Tendril](https://marketplace.visualstudio.com/items?itemName=ivy-interactive.ivy-tendril)" >> $GITHUB_STEP_SUMMARY
          fi
