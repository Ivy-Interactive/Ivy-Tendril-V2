name: Release Server

on:
  workflow_dispatch:
    inputs:
      test-mode:
        description: 'Dry-run test mode (skips creating GitHub release)'
        type: boolean
        default: true
      version:
        description: 'Version override (e.g. 0.1.0)'
        type: string
        required: false
  push:
    tags:
      - 'server-v*'

permissions:
  contents: write

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-server:
    name: Build Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          # Intel macOS, to match the CLI matrix. Without it a user on an Intel Mac could install
          # the CLI but had no server build to pair with it.
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # tendril-wireframe embeds the generated payload with include_bytes!, and build.rs fails the
      # build without it. It is not checked in, so it must be generated before cargo runs. This job
      # otherwise needs no Node at all.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate wireframe payload
        working-directory: src/crates/tendril-wireframe/pipeline/vendor
        run: |
          pnpm install --frozen-lockfile
          node build-all.mjs

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: cross-rs/cargo-install-action@v1
        with:
          tool: cross

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/server-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/server-v}"
          else
            VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "tendril-server") | .version')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin tendril-server
          else
            cargo build --release --target ${{ matrix.target }} --bin tendril-server
          fi

      - name: Assemble release archive
        run: |
          STAGING="tendril-server-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tendril-server.exe" "$STAGING/"
            [ -f README.md ] && cp README.md "$STAGING/"
            [ -f LICENSE ] && cp LICENSE "$STAGING/"
            ARCHIVE="${STAGING}.zip"
            7z a "$ARCHIVE" "$STAGING"
          else
            cp "target/${{ matrix.target }}/release/tendril-server" "$STAGING/"
            [ -f README.md ] && cp README.md "$STAGING/"
            [ -f LICENSE ] && cp LICENSE "$STAGING/"
            ARCHIVE="${STAGING}.tar.gz"
            tar -czvf "$ARCHIVE" "$STAGING"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "CHECKSUM=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tendril-server-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && !inputs.test-mode) || (github.event_name == 'workflow_dispatch' && inputs.test-mode == false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-v${{ env.VERSION }}
          # Tag the exact commit this run built, not the default branch head.
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
