name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # ubuntu-latest ships ~14 GB free on /, and `target/debug` for this workspace is ~14 GB on
        # its own. Reclaiming the preinstalled toolchains we never use gives ~20 GB of headroom, so
        # `cargo test --workspace` stops hitting "No space left on device" — which surfaces as
        # `collect2: fatal error: ld terminated with signal 7 [Bus error]` from the linker.
        # See https://github.com/Ivy-Interactive/Ivy-Tendril-V2/actions/runs/34857841035
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser dependencies
        run: pnpm run install:playwright:deps

      - name: Frontend build
        run: pnpm build

      - name: Frontend checks
        run: pnpm check

      - name: Agent skills manifest check
        run: pnpm run test-skills-manifests

      - name: Frontend tests
        run: pnpm test

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Extension build
        run: pnpm build:extension

      - name: Extension tests
        run: pnpm test:extension

      - name: Extension package validation
        run: pnpm package:extension

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - name: Format check
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust Test
        # `-j 2` caps concurrent codegen and link jobs. On a 4-core runner cargo otherwise runs four
        # link steps at once — the Tauri app links ~300 rlibs per integration test binary — which
        # spikes both linker RSS and the peak on-disk size of target/debug. Together with
        # `debug = 0` in the root Cargo.toml this keeps the step inside the runner's budget.
        # See the bus error in https://github.com/Ivy-Interactive/Ivy-Tendril-V2/actions/runs/34857841035
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace

      - name: Rust Build
        # Same cap, same reason as Rust Test above.
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --workspace

  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-cache-${{ runner.os }}-

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --cache --max-cache-age 1d "README*.md" "docs/**/*.md" "src/apps/tendril-docs/content/**/*.md"
          fail: true

  docs:
    name: Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Components build
        run: pnpm --filter @ivy-interactive/components build

      - name: Docs build
        run: pnpm --filter @ivy-interactive/tendril-docs build

      - name: Docs tests
        run: pnpm --filter @ivy-interactive/tendril-docs test

      - name: Docs checks
        run: pnpm --filter @ivy-interactive/tendril-docs check

