[workspace]
members = [
    "src/crates/*",
    "src/apps/tendril-app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ivy Interactive"]
license = "FSL-1.1-ALv2"
repository = "https://github.com/Ivy-Interactive/Ivy-Tendril-V2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
walkdir = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
# The WebViewer proxy re-emits a rewritten body instead of relaying the original bytes, so
# responses have to arrive decompressed; `stream` lets non-text bodies pass straight through.
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "stream"] }
rand = "0.8"
libc = "0.2"
tokio-tungstenite = "0.24"
lol_html = "3.0"
base64 = "0.22"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Password hashing for `tendril hash-password` and the server's Basic-auth verification path. The
# parameters are pinned in those two places rather than here, because they must match the hashes the
# original Tendril already wrote into users' config.yaml.
argon2 = "0.5"
# Self-signed localhost certificates for `tendril generate-certs`.
rcgen = "0.13"
# TLS listener for `tendril serve --tls-cert/--tls-key`. Plain `axum::serve` has no TLS.
#
# `tls-rustls-no-provider` rather than `tls-rustls`: the latter turns on `rustls/aws-lc-rs`, which
# both drags in the `aws-lc-sys` C build and leaves rustls with two enabled providers and therefore
# no unambiguous default — `RustlsConfig::from_pem_file` then panics at runtime. `ring` is already
# enabled workspace-wide (reqwest's `rustls-tls` in tendril-app), so the server installs the ring
# provider explicitly instead.
axum-server = { version = "0.7", default-features = false, features = [
    "tls-rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
