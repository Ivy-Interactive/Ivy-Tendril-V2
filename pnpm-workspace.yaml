packages:
  - "src/apps/*"
  - "src/packages/*"
  - "src/extensions/*"

allowBuilds:
  "@swc/core": false
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0

minimumReleaseAgeExclude:
  - playwright-core@1.63.0
  - playwright@1.63.0
  - '@tanstack/react-virtual@3.14.13'
  - '@tanstack/virtual-core@3.17.11'

overrides:
  playwright@*: 1.63.0
  playwright-core@*: 1.63.0
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

virtualStoreDirMaxLength: 40
