[package]
name = "tendril-app"
# Inherited, like every other crate in the workspace. This was the one manifest carrying its own
# copy, so a release that bumped `[workspace.package]` left the desktop crate behind - and the
# "SpaceCorps" author string disagreed with the rest of the tree.
version.workspace = true
description = "Tendril Desktop Application"
authors.workspace = true
edition.workspace = true
# Not `rust-version.workspace = true`: the desktop crate's floor is genuinely higher than the rest
# of the workspace's. `notify-rust` 4.18 (via tauri-plugin-notification) declares 1.89, so inheriting
# the workspace's 1.88 would claim support this crate does not have. The three library/CLI crates
# stay at 1.88; only the Tauri chain forces 1.89.
rust-version = "1.89"

[lib]
name = "tendril_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
anyhow = "1"
base64 = "0.22"
url = "2"
# Only for the `.master` lifecycle: the app deletes that file, so it classifies it with the daemon's own
# `inspect_master_file`/`MasterClaim` rather than a second implementation that can drift from it. The
# rest of the app still talks to the daemon over HTTP and shares no types with it.
tendril-core = { path = "../../../crates/tendril-core" }
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `test` gives us `tauri::test::mock_app`, needed to build anything that takes an `AppHandle`.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
base64 = "0.22"
# Tests only: the file-preview command's whole claim is that the daemon's `local_file_guard` is what
# decides which paths may be read, and that claim can only be tested against the real router.
tendril-server = { path = "../../../crates/tendril-server" }
# The daemon's router is built on the workspace's axum 0.7, so serving it needs that version's `serve`.
# The app's own mock daemons are on 0.8, hence the alias rather than a downgrade.
axum07 = { package = "axum", version = "0.7" }

