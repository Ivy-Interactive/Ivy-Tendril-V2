<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="t d"><title id="t">What a cold load puts on the internal sockets (small, 50 plans)</title><desc id="d">Assets: documents, scripts, styles, fonts, images. Data: everything else (API, IPC bridges, WebSocket, SSE); WebSocket bytes are part of data. Architecture-internal sockets, not like for like: V1 is the page and its server (assets included); V2 is the Tauri host (the IPC shim running the real command handlers) and the daemon, no assets or IPC. Log scale.</desc><style>svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}text{font-variant-numeric:tabular-nums}.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ring{stroke:#fcfcfb}.gap{stroke:#fcfcfb}.lead{stroke:#898781}.wh{stroke:#0b0b0b}.hollow{fill:#fcfcfb;stroke:#898781}.halo{stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}.f-v1{fill:#2a78d6}.s-v1{stroke:#2a78d6}.o-v1{fill:#fcfcfb;stroke:#2a78d6}.f-v2{fill:#eb6834}.s-v2{stroke:#eb6834}.o-v2{fill:#fcfcfb;stroke:#eb6834}.f-c0{fill:#1baf7a}.t-c0{fill:#0b0b0b}.f-c1{fill:#eda100}.t-c1{fill:#0b0b0b}.f-c2{fill:#e87ba4}.t-c2{fill:#0b0b0b}.f-c3{fill:#008300}.t-c3{fill:#ffffff}.f-c4{fill:#4a3aa7}.t-c4{fill:#ffffff}.f-c5{fill:#e34948}.t-c5{fill:#0b0b0b}.f-co{fill:#a9a79f}.t-co{fill:#0b0b0b}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ring{stroke:#1a1a19}.gap{stroke:#1a1a19}.lead{stroke:#898781}.wh{stroke:#ffffff}.hollow{fill:#1a1a19;stroke:#898781}.halo{stroke:#1a1a19;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}.f-v1{fill:#3987e5}.s-v1{stroke:#3987e5}.o-v1{fill:#1a1a19;stroke:#3987e5}.f-v2{fill:#d95926}.s-v2{stroke:#d95926}.o-v2{fill:#1a1a19;stroke:#d95926}.f-c0{fill:#199e70}.