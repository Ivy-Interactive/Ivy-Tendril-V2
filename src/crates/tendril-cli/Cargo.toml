[package]
name = "tendril-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "tendril_cli"
path = "src/lib.rs"

[[bin]]
name = "tendril"
path = "src/main.rs"

[dependencies]
tendril-core = { path = "../tendril-core" }
tendril-server = { path = "../tendril-server" }
tendril-wireframe = { path = "../tendril-wireframe" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# `multipart` is on top of the workspace features for `report-bug --submit`, which posts the
# diagnostic bundle as a file part.
reqwest = { workspace = true, features = ["multipart"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
rcgen = { workspace = true }
# `report-bug` writes a zip on every platform, so this is no longer a Windows-only dependency (it
# started out as one for `update`'s archive extraction).
zip = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
# So `generate-certs`' tests can parse the pair back the way a TLS listener does, without standing
# one up.
rustls-pemfile = "2"
