# Lychee configuration for markdown link validation

# Cache settings
cache = true
max_cache_age = "1d"

# Accepted HTTP status codes (ignore rate limits)
accept = [200, 204, 429]

# Excluded link patterns (regexes)
exclude = [
  "^https://youtu\\.be/",
  "^https://www\\.youtube\\.com/",
  "^https://discord\\.gg/",
  # Documentation host is not published yet (DNS NXDOMAIN);
  # re-enable this check once tendril.ivy.app resolves.
  "^https://tendril\\.ivy\\.app",
  # GitHub gates the stargazers list behind sign-in, so it 404s for any
  # unauthenticated checker on every public repo. Not a broken link.
  "^https://github\\.com/[^/]+/[^/]+/stargazers$",
]

# Excluded file paths
exclude_path = [
  "node_modules",
  "target",
  "dist",
]

# Request timeout and retries
timeout = 15
max_retries = 2
